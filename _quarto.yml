project:
  type: website
  output-dir: _site
  render:
  - '*.qmd'
  - '**/*.qmd'
  - '!agent/'
  - '!reference/'
  - '!docs/'
  pre-render: _scripts/notes_index.py
website:
  title: Carnet IA
  description: Notes on how LLMs work, how to build agents, and how to evaluate and safeguard them.
  site-url: https://salouaaifqui.github.io/carnet-ia/
  repo-url: https://github.com/SalouaAifqui/carnet-ia
  favicon: assets/logo.svg
  search:
    location: navbar
    type: textbox
  page-navigation: true
  bread-crumbs: true
  navbar:
    logo: assets/logo.svg
    title: Carnet IA
    left:
    - href: llms/index.qmd
      text: LLMs
    - href: agents/index.qmd
      text: Agents
    - href: evaluation/index.qmd
      text: Evaluation & Guardrails
    - href: toolbox/index.qmd
      text: Toolbox
    right:
    - icon: github
      href: https://github.com/SalouaAifqui/carnet-ia
      aria-label: GitHub
  sidebar:
  - id: agents
    title: Agents
    style: docked
    collapse-level: 1
    contents:
    - agents/index.qmd
    - section: Foundations
      contents: agents/foundations/*.qmd
    - section: Memory
      contents: agents/memory/*.qmd
    - section: Control
      contents: agents/control/*.qmd
  - id: llms
    title: LLMs
    style: docked
    collapse-level: 1
    contents:
    - llms/index.qmd
    - section: How LLMs work
      contents: llms/how-llms-work/*.qmd
  - id: evaluation
    title: Evaluation & Guardrails
    style: docked
    collapse-level: 1
    contents:
    - evaluation/index.qmd
    - section: Evaluating agents
      contents: evaluation/agents/*.qmd
    - section: Evaluating LLMs
      contents: evaluation/llms/*.qmd
    - section: Guardrails
      contents: evaluation/guardrails/*.qmd
  - id: toolbox
    title: Toolbox
    style: docked
    collapse-level: 1
    contents:
    - toolbox/index.qmd
    - section: Tools
      contents: toolbox/tools/*.qmd
  page-footer:
    left: Carnet IA · notes written while learning
    right: Built with [Quarto](https://quarto.org) · [GitHub](https://github.com/SalouaAifqui/carnet-ia)
format:
  html:
    theme:
      light:
      - cosmo
      - assets/theme.scss
      dark:
      - cosmo
      - assets/theme.scss
      - assets/theme-dark.scss
    toc: true
    toc-title: On this page
    toc-location: left
    toc-depth: 2
    grid:
      sidebar-width: 260px
      body-width: 700px
      margin-width: 240px
      gutter-width: 2.5rem
    filters:
    - _filters/carnet.lua
    include-after-body:
    - _carnet/notes-data.html
    - _includes/reading.html
    code-copy: true
    code-overflow: scroll
    highlight-style: dracula
    lang: en
