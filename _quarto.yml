project:
  type: website
  output-dir: _site
  render:
  - '*.qmd'
  - '**/*.qmd'
  - '!agent/'
website:
  title: Carnet IA
  description: Notes on how LLMs work, how to build agents, how to keep them safe, and how to use AI every day.
  site-url: https://salouaaifqui.github.io/carnet-ia/
  repo-url: https://github.com/SalouaAifqui/carnet-ia
  favicon: assets/logo.svg
  search: true
  page-navigation: true
  bread-crumbs: true
  navbar:
    logo: assets/logo.svg
    title: Carnet IA
    left:
    - href: llms/index.qmd
      text: LLMs
    - href: agents/index.qmd
      text: Agents
    - href: guardrails/index.qmd
      text: Guardrails
    - href: daily-use/index.qmd
      text: Daily Use
    right:
    - icon: github
      href: https://github.com/SalouaAifqui/carnet-ia
      aria-label: GitHub
  sidebar:
  - id: agents
    title: Agents
    style: docked
    contents:
    - agents/index.qmd
    - section: Foundations
      contents:
      - agents/foundations/what-is-an-agent.qmd
      - agents/foundations/building-agents-with-langgraph.qmd
      - agents/foundations/tools-and-agentic-search.qmd
    - section: Memory
      contents:
      - agents/memory/memory-overview.qmd
      - agents/memory/short-term-memory.qmd
      - agents/memory/long-term-memory.qmd
    - section: Control
      contents:
      - agents/control/controlling-a-running-agent.qmd
  - id: llms
    title: LLMs
    style: docked
    contents:
    - llms/index.qmd
  - id: guardrails
    title: Guardrails
    style: docked
    contents:
    - guardrails/index.qmd
  - id: daily-use
    title: Daily Use
    style: docked
    contents:
    - daily-use/index.qmd
  page-footer:
    left: Carnet IA · notes written while learning
    right:
    - icon: github
      href: https://github.com/SalouaAifqui/carnet-ia
      aria-label: GitHub
format:
  html:
    theme:
      light:
      - cosmo
      - assets/theme.scss
      dark:
      - cosmo
      - assets/theme.scss
      - assets/theme-dark.scss
    toc: true
    toc-title: On this page
    code-copy: true
    code-overflow: wrap
    highlight-style: dracula
    lang: en
