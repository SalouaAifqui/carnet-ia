project:
  type: website
  output-dir: _site

website:
  title: "Carnet IA"
  description: "Study notes and articles on building AI agents."
  site-url: "https://salouaaifqui.github.io/carnet-ia/"
  repo-url: "https://github.com/SalouaAifqui/carnet-ia"
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: notes/index.qmd
        text: Notes
      - href: articles/index.qmd
        text: Articles
    right:
      - icon: github
        href: "https://github.com/SalouaAifqui/carnet-ia"
        aria-label: GitHub
  sidebar:
    - title: "Notes"
      style: docked
      contents:
        - notes/index.qmd
        - section: "AI Agents in LangGraph"
          contents: "notes/langgraph/*.qmd"
  page-footer:
    center: "Carnet IA · notes written while learning"

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [cosmo, assets/theme.scss, assets/theme-dark.scss]
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    lang: en
