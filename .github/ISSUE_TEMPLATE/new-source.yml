name: New source
description: Ask the agent to turn one or more web pages into a note (you approve its plan first).
title: "Source: "
labels: ["source"]
body:
  - type: input
    id: url
    attributes:
      label: URL
      description: The main page to learn from (article, lesson, documentation…).
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: >-
        Other pages on the same subject, one URL per line: the agent reads all of them together
        and writes ONE note. Anything else you write here is an instruction for the agent
        (for example "focus on the code" or "put it in Evaluation").
      placeholder: |
        https://another-page-on-the-same-subject
        https://and-another-one
        Focus on the practical examples.
