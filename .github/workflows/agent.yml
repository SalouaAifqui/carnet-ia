name: Carnet agent

# Two moments, two runs:
#   1. An issue gets the "source" label  → the agent researches and posts a PLAN, then stops.
#   2. The repo owner answers on the issue (/approve, /replan, /cancel) → the agent resumes.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: carnet-agent-${{ github.event.issue.number }}

jobs:
  plan:
    if: github.event_name == 'issues' && github.event.label.name == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      - name: Research and post the plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_TEXT: ${{ github.event.issue.title }} ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cd agent
          python -m carnet_agent.run --mode plan --issue "$ISSUE_NUMBER" --from-text "$ISSUE_TEXT"
      - name: Report a failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "❌ The agent could not prepare a plan. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  resume:
    # Only on issues (not pull requests) labelled "source", only for commands from the repo owner.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'source') &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      - name: Resume the agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "carnet-ia-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd agent
          python -m carnet_agent.run --mode resume --issue "$ISSUE_NUMBER" --command "$COMMENT"
      - name: Report a failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "❌ The agent stopped with an error. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
