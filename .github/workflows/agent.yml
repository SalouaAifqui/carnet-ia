name: Carnet agent

# Runs when an issue gets the "source" label (the "New source" issue form adds it).
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: carnet-agent-${{ github.event.issue.number }}

jobs:
  run:
    if: github.event.label.name == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the agent
        run: pip install -r agent/requirements.txt

      - name: Run the agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_TEXT: ${{ github.event.issue.title }} ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "carnet-ia-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd agent
          python -m carnet_agent.run --from-text "$ISSUE_TEXT" --issue "$ISSUE_NUMBER" 2>&1 | tee ../agent-output.txt
          exit ${PIPESTATUS[0]}

      - name: Report on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if grep -q "^Pull request:" agent-output.txt 2>/dev/null; then
            echo "✅ $(grep '^Pull request:' agent-output.txt)" > comment.md
          else
            printf '❌ The agent could not finish. Details: %s\n\n```\n%s\n```\n' "$RUN_URL" "$(tail -n 25 agent-output.txt 2>/dev/null)" > comment.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
