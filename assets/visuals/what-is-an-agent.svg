<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="The ReAct loop: Question, then Thought, Action, Observation repeated until an Answer" style="display: block; width: 100%; height: auto; background: #eef2ff"><rect x="28" y="40" width="92" height="23" rx="11.5" fill="#ffffff"></rect><text x="74.0" y="55.82" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#16202e" text-anchor="middle">Question</text><rect x="214" y="26" width="140" height="56" rx="10" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.2"></rect><text x="284.0" y="51.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Thought</text><text x="284.0" y="67.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">the LLM reasons</text><rect x="408" y="40" width="84" height="23" rx="11.5" fill="#0f7a52"></rect><text x="450.0" y="55.82" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Answer</text><defs><marker id="v-agent-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586174"></path></marker></defs><path d="M120 53 L210 53" fill="none" stroke="#586174" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-agent-m1)"></path><defs><marker id="v-agent-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a52"></path></marker></defs><path d="M354 53 L404 53" fill="none" stroke="#0f7a52" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-agent-m2)"></path><rect x="366" y="192" width="136" height="56" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="434.0" y="217.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Action</text><text x="434.0" y="233.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">picks a tool</text><rect x="150" y="192" width="140" height="56" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="220.0" y="217.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Observation</text><text x="220.0" y="233.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">your code runs it</text><defs><marker id="v-agent-m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f54d6"></path></marker></defs><path d="M318 84 C 350 130, 405 145, 428 188" fill="none" stroke="#2f54d6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-agent-m3)"></path><defs><marker id="v-agent-m4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f54d6"></path></marker></defs><path d="M366 220 L294 220" fill="none" stroke="#2f54d6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-agent-m4)"></path><defs><marker id="v-agent-m5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f54d6"></path></marker></defs><path d="M200 190 C 190 140, 220 110, 244 86" fill="none" stroke="#2f54d6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-agent-m5)"></path><text x="292" y="150" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#586174" text-anchor="middle">repeat until done</text><text x="292" y="166" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">(max_turns caps it)</text><rect x="26" y="270" width="10" height="10" rx="3" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.2"></rect><text x="42" y="279" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#16202e" text-anchor="start">the LLM decides</text><rect x="150" y="270" width="10" height="10" rx="3" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="166" y="279" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#16202e" text-anchor="start">your code executes</text></svg>