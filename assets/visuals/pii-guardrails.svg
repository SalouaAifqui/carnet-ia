<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="PII guardrail: names and phone numbers are detected and replaced by placeholders, on input and on output" style="display: block; width: 100%; height: auto; background: #e8f6ef"><text x="24" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#586174" text-anchor="start" letter-spacing="0.08em">INPUT</text><rect x="24" y="40" width="472" height="48" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="40" y="69" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16202e" text-anchor="start">My name is</text><rect x="112" y="53" width="72" height="22" rx="5" fill="#fff3e2" stroke="#b45309" stroke-width="1.2"></rect><text x="148" y="69" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Hank Tate</text><text x="192" y="69" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16202e" text-anchor="start">and my phone number is</text><rect x="344" y="53" width="100" height="22" rx="5" fill="#fff3e2" stroke="#b45309" stroke-width="1.2"></rect><text x="394" y="69" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">•••-••••</text><defs><marker id="v-pii-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a52"></path></marker></defs><path d="M260 92 L260 112" fill="none" stroke="#0f7a52" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-pii-m1)"></path><rect x="170" y="116" width="180" height="48" rx="10" fill="#0f7a52" stroke="#0f7a52" stroke-width="1.2"></rect><text x="260.0" y="137.0" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Detect &amp; redact</text><text x="260.0" y="153.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">Presidio + your own rules</text><defs><marker id="v-pii-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a52"></path></marker></defs><path d="M260 166 L260 186" fill="none" stroke="#0f7a52" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-pii-m2)"></path><rect x="24" y="190" width="472" height="48" rx="10" fill="#e8f6ef" stroke="#0f7a52" stroke-width="1.2"></rect><text x="40" y="219" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16202e" text-anchor="start">My name is</text><text x="148" y="219" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0f7a52" text-anchor="middle">&lt;PERSON&gt;</text><text x="192" y="219" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16202e" text-anchor="start">and my phone number is</text><text x="394" y="219" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0f7a52" text-anchor="middle">&lt;PHONE_NUMBER&gt;</text><circle cx="34" cy="268" r="8" fill="#0f7a52" stroke="#0f7a52" stroke-width="1.4"></circle><path d="M30 268 L33 271 L38.5 264.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="48" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#16202e" text-anchor="start">Input guard</text><text x="48" y="282" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">before the LLM sees it</text><circle cx="278" cy="268" r="8" fill="#0f7a52" stroke="#0f7a52" stroke-width="1.4"></circle><path d="M274 268 L277 271 L282.5 264.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="292" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#16202e" text-anchor="start">Output guard</text><text x="292" y="282" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">while the reply streams</text></svg>