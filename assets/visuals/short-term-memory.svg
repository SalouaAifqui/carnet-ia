<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Short-term memory: a checkpointer saves state after every step under a thread id" style="display: block; width: 100%; height: auto; background: #eef2ff"><rect x="24" y="22" width="158" height="22" rx="11.0" fill="#ffffff"></rect><text x="103.0" y="36.96" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2f54d6" text-anchor="middle">thread_id = &quot;alice-1&quot;</text><path d="M50 120 L430 120" stroke="#2f54d6" stroke-width="2.5"></path><rect x="32" y="56" width="76" height="40" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><rect x="42" y="66" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="42" y="74" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="42" y="82" width="34" height="3" rx="1.5" fill="#c9d0dc"></rect><path d="M70 96 L70 112" stroke="#d9dee8" stroke-width="1.2"></path><circle cx="70" cy="120" r="8" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><text x="70" y="146" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">step 1</text><rect x="132" y="56" width="76" height="40" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><rect x="142" y="66" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="142" y="74" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="142" y="82" width="34" height="3" rx="1.5" fill="#c9d0dc"></rect><path d="M170 96 L170 112" stroke="#d9dee8" stroke-width="1.2"></path><circle cx="170" cy="120" r="8" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><text x="170" y="146" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">step 2</text><rect x="232" y="56" width="76" height="40" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><rect x="242" y="66" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="242" y="74" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="242" y="82" width="34" height="3" rx="1.5" fill="#c9d0dc"></rect><path d="M270 96 L270 112" stroke="#d9dee8" stroke-width="1.2"></path><circle cx="270" cy="120" r="8" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><text x="270" y="146" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">step 3</text><rect x="332" y="56" width="76" height="40" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><rect x="342" y="66" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="342" y="74" width="56" height="3" rx="1.5" fill="#c9d0dc"></rect><rect x="342" y="82" width="34" height="3" rx="1.5" fill="#c9d0dc"></rect><path d="M370 96 L370 112" stroke="#d9dee8" stroke-width="1.2"></path><circle cx="370" cy="120" r="8" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><text x="370" y="146" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">step 4</text><defs><marker id="v-short-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a52"></path></marker></defs><path d="M430 120 L488 120" fill="none" stroke="#0f7a52" stroke-width="2" stroke-linecap="round" marker-end="url(#v-short-m1)"></path><text x="462" y="106" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0f7a52" text-anchor="middle">resume</text><text x="260" y="172" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16202e" text-anchor="middle">same id → picks up where it left off, whole history included</text><path d="M24 196 L496 196" stroke="#d9dee8" stroke-width="1"></path><rect x="24" y="214" width="145" height="22" rx="11.0" fill="#ffffff"></rect><text x="96.5" y="228.96" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#586174" text-anchor="middle">thread_id = &quot;bob-1&quot;</text><path d="M50 262 L200 262" stroke="#d9dee8" stroke-width="2.5" stroke-dasharray="4 5"></path><circle cx="70" cy="262" r="8" fill="#ffffff" stroke="#586174" stroke-width="1.6"></circle><text x="220" y="258" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#586174" text-anchor="start">new id → starts from scratch</text><text x="220" y="274" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="start">also what makes pause &amp; resume possible</text></svg>