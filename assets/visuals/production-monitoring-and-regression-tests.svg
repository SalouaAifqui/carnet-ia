<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Production failures turned into regression tests in the offline benchmark, in a closed loop" style="display: block; width: 100%; height: auto; background: #fdeef4"><rect x="24" y="62" width="184" height="184" rx="14" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="116" y="84" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#16202e" text-anchor="middle">Production</text><text x="116" y="100" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">messy, real traffic</text><rect x="46.0" y="112" width="140" height="22" rx="11.0" fill="#fdeef4"></rect><text x="116.0" y="126.96" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#c2255c" text-anchor="middle">monitoring</text><rect x="46.0" y="144" width="140" height="22" rx="11.0" fill="#fdeef4"></rect><text x="116.0" y="158.96" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#c2255c" text-anchor="middle">manual review</text><rect x="46.0" y="176" width="140" height="22" rx="11.0" fill="#fdeef4"></rect><text x="116.0" y="190.96" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#c2255c" text-anchor="middle">user feedback</text><rect x="46.0" y="208" width="140" height="22" rx="11.0" fill="#fdeef4"></rect><text x="116.0" y="222.96" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#c2255c" text-anchor="middle">A/B tests</text><rect x="312" y="62" width="184" height="184" rx="14" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="404" y="84" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#16202e" text-anchor="middle">Offline benchmark</text><text x="404" y="100" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">stable, comparable</text><rect x="336" y="116" width="136" height="20" rx="6" fill="#fdeef4" stroke="#fdeef4" stroke-width="1.2"></rect><text x="404" y="130" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#c2255c" text-anchor="middle">case 1</text><rect x="336" y="144" width="136" height="20" rx="6" fill="#fdeef4" stroke="#fdeef4" stroke-width="1.2"></rect><text x="404" y="158" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#c2255c" text-anchor="middle">case 2</text><rect x="336" y="172" width="136" height="20" rx="6" fill="#fdeef4" stroke="#fdeef4" stroke-width="1.2"></rect><text x="404" y="186" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#c2255c" text-anchor="middle">case 3</text><rect x="336" y="200" width="136" height="20" rx="6" fill="#c2255c" stroke="#c2255c" stroke-width="1.2"></rect><text x="404" y="214" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">new regression test</text><defs><marker id="v-prod-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c92a2a"></path></marker></defs><path d="M208 124 C 246 88, 274 88, 310 124" fill="none" stroke="#c92a2a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#v-prod-m1)"></path><text x="260" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#c92a2a" text-anchor="middle">failure found</text><text x="260" y="54" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">→ becomes a test</text><defs><marker id="v-prod-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2255c"></path></marker></defs><path d="M312 192 C 274 228, 246 228, 210 192" fill="none" stroke="#c2255c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#v-prod-m2)"></path><text x="260" y="254" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#c2255c" text-anchor="middle">every new version</text><text x="260" y="268" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">checked before release</text><text x="260" y="292" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#16202e" text-anchor="middle">old bugs never come back</text></svg>