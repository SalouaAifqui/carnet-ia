<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Agent-based evaluation: a human sets goals, an agent judge reads trajectories, failures split into harness, context and model" style="display: block; width: 100%; height: auto; background: #fdeef4"><circle cx="56" cy="52" r="12" fill="#fdeef4" stroke="#c2255c" stroke-width="1.6"></circle><path d="M36 86 C 36 70, 76 70, 76 86" fill="#fdeef4" stroke="#c2255c" stroke-width="1.6"></path><text x="90" y="54" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#16202e" text-anchor="start">Human</text><text x="90" y="71" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="start">sets goals, decides what “good” means</text><defs><marker id="v-agb-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586174"></path></marker></defs><path d="M56 96 L56 128" fill="none" stroke="#586174" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-agb-m1)"></path><rect x="24" y="132" width="150" height="58" rx="10" fill="#c2255c" stroke="#c2255c" stroke-width="1.2"></rect><text x="99.0" y="158.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Agent judge</text><text x="99.0" y="174.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">reads trajectories</text><rect x="24" y="222" width="150" height="52" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="99.0" y="252.5" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#16202e" text-anchor="middle">Agent under test</text><defs><marker id="v-agb-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2255c"></path></marker></defs><path d="M99 220 L99 194" fill="none" stroke="#c2255c" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#v-agb-m2)"></path><text x="112" y="210" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#c2255c" text-anchor="start">trace</text><text x="306" y="112" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#586174" text-anchor="middle" letter-spacing="0.08em">WHERE DID IT FAIL?</text><rect x="220" y="124" width="172" height="44" rx="8" fill="#fdeef4" stroke="#c2255c" stroke-width="1.2"></rect><text x="234" y="143" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Harness</text><text x="234" y="159" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">loop, tools, orchestration</text><rect x="220" y="176" width="172" height="44" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="234" y="195" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Context</text><text x="234" y="211" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">what it was given</text><rect x="220" y="228" width="172" height="44" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="234" y="247" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Model</text><text x="234" y="263" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">the LLM itself</text><defs><marker id="v-agb-m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586174"></path></marker></defs><path d="M176 160 L216 160" fill="none" stroke="#586174" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-agb-m3)"></path><rect x="408" y="124" width="88" height="148" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2" stroke-dasharray="4 4"></rect><text x="452" y="148" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#16202e" text-anchor="middle">multi-</text><text x="452" y="162" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#16202e" text-anchor="middle">agent</text><circle cx="452" cy="188" r="8" fill="#fdeef4" stroke="#c2255c" stroke-width="1.4"></circle><circle cx="452" cy="214" r="8" fill="#fdeef4" stroke="#c2255c" stroke-width="1.4"></circle><circle cx="452" cy="240" r="8" fill="#fdeef4" stroke="#c2255c" stroke-width="1.4"></circle><text x="452" y="290" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#586174" text-anchor="middle">the whole setup</text></svg>