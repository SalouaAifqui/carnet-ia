roke="#d9480f" stroke-width="1.2"></rect><text x="460" y="78" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.08em">LEVEL 5</text><text x="460" y="98" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Full</text><text x="460" y="114" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">system</text><path d="M427.5 44 L492.5 44" stroke="#586174" stroke-width="1.4"></path><circle cx="427.5" cy="44" r="4.2" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="440.5" cy="44" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="453.5" cy="44" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="466.5" cy="44" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="479.5" cy="44" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="492.5" cy="44" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="30" cy="36" r="6" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><text x="44" y="40" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16202e" text-anchor="start">nodes do the work</text><defs><marker id="v-lg-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586174"></path></marker></defs><path d="M24 62 L38 62" fill="none" stroke="#586174" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-lg-m1)"></path><text x="44" y="66" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#16202e" text-anchor="start">edges pick what runs next</text><rect x="24" y="82" width="14" height="10" rx="3" fill="#eef2ff" stroke="#2f54d6" stroke-width="1.2"></rect><text x="44" y="92" font-family="Inter, sans-serif" font-size="12" font