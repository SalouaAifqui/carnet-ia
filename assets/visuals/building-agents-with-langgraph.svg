<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Five levels of agent design with LangGraph, from a tool loop to a full system" style="display: block; width: 100%; height: auto; background: #eef2ff"><rect x="22" y="206" width="92" height="76" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="68" y="226" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2f54d6" text-anchor="middle" letter-spacing="0.08em">LEVEL 1</text><text x="68" y="246" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Tool</text><text x="68" y="262" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">loop</text><path d="M61.5 192 L74.5 192" stroke="#586174" stroke-width="1.4"></path><circle cx="61.5" cy="192" r="4.2" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="74.5" cy="192" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><rect x="120" y="169" width="92" height="113" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="166" y="189" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2f54d6" text-anchor="middle" letter-spacing="0.08em">LEVEL 2</text><text x="166" y="209" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Router</text><path d="M153.0 155 L179.0 155" stroke="#586174" stroke-width="1.4"></path><circle cx="153.0" cy="155" r="4.2" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="166.0" cy="155" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><circle cx="179.0" cy="155" r="4.2" fill="#ffffff" stroke="#2f54d6" stroke-width="1.4"></circle><rect x="218" y="132" width="92" height="150" rx="8" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.2"></rect><text x="264" y="152" font-family="Inter, sans-serif" font-s