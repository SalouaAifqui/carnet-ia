<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Competitor-mention guardrail: exact match, then NER, then embedding similarity catch JPMC as JPMorgan" style="display: block; width: 100%; height: auto; background: #e8f6ef"><rect x="24" y="22" width="472" height="46" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="40" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#586174" text-anchor="start">Model output:</text><text x="130" y="50" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#16202e" text-anchor="start">“For mortgages, </text><rect x="236" y="34" width="46" height="22" rx="5" fill="#fdeceb" stroke="#c92a2a" stroke-width="1.2"></rect><text x="259" y="50" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="middle">JPMC</text><text x="288" y="50" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#16202e" text-anchor="start">may suit you better.”</text><rect x="24" y="94" width="144" height="74" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="38" y="116" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f7a52" text-anchor="start">1</text><text x="52" y="116" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Exact match</text><text x="38" y="134" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">“JPMorgan” in text?</text><circle cx="46" cy="152" r="7" fill="#b45309" stroke="#b45309" stroke-width="1.4"></circle><path d="M46 147.5 L46 152.5" stroke="#fff" stroke-width="2" stroke-linecap="round"></path><circle cx="46" cy="156" r="1.2" fill="#fff" stroke="#fff" stroke-width="0.5"></circle><text x="58" y="156" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="start">no match</text><defs><marker id="v-comp-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586174"></path></marker></defs><path d="M170 131 L186 131" fill="none" stroke="#586174" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-comp-m1)"></path><rect x="188" y="94" width="144" height="74" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="202" y="116" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f7a52" text-anchor="start">2</text><text x="216" y="116" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">NER</text><text x="202" y="134" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">extract entities</text><circle cx="210" cy="152" r="7" fill="#b45309" stroke="#b45309" stroke-width="1.4"></circle><path d="M210 147.5 L210 152.5" stroke="#fff" stroke-width="2" stroke-linecap="round"></path><circle cx="210" cy="156" r="1.2" fill="#fff" stroke="#fff" stroke-width="0.5"></circle><text x="222" y="156" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="start">found “JPMC”</text><defs><marker id="v-comp-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586174"></path></marker></defs><path d="M334 131 L350 131" fill="none" stroke="#586174" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-comp-m2)"></path><rect x="352" y="94" width="144" height="74" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="1.2"></rect><text x="366" y="116" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f7a52" text-anchor="start">3</text><text x="380" y="116" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Similarity</text><text x="366" y="134" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">embedding vs list</text><circle cx="374" cy="152" r="7" fill="#c92a2a" stroke="#c92a2a" stroke-width="1.4"></circle><path d="M370.5 148.5 L377.5 155.5 M377.5 148.5 L370.5 155.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"></path><text x="386" y="156" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#c92a2a" text-anchor="start">≈ JPMorgan → fail</text><text x="260" y="192" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">cheap checks first, smarter checks only when needed</text><defs><marker id="v-comp-m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a52"></path></marker></defs><path d="M260 200 L260 220" fill="none" stroke="#0f7a52" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-comp-m3)"></path><rect x="24" y="226" width="472" height="46" rx="10" fill="#e8f6ef" stroke="#0f7a52" stroke-width="1.2"></rect><text x="40" y="254" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#586174" text-anchor="start">User sees:</text><text x="116" y="254" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#16202e" text-anchor="start">“For mortgages, here is what we offer…”</text></svg>