<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Custom guardrails: validators inside a guard, inside a Guardrails Server between the app and the LLM API" style="display: block; width: 100%; height: auto; background: #e8f6ef"><rect x="16" y="114" width="90" height="68" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="61" y="140" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#16202e" text-anchor="middle">App</text><text x="61" y="157" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="middle">OpenAI-style</text><text x="61" y="170" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="middle">client</text><rect x="128" y="30" width="264" height="240" rx="16" fill="#ffffff" stroke="#0f7a52" stroke-width="1.6"></rect><text x="146" y="54" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f7a52" text-anchor="start">Guardrails Server</text><text x="146" y="70" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">sits in front of the LLM API</text><rect x="146" y="86" width="228" height="166" rx="12" fill="#e8f6ef" stroke="#e8f6ef" stroke-width="1.2"></rect><text x="162" y="108" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#16202e" text-anchor="start">Guard</text><text x="162" y="124" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#586174" text-anchor="start">names the policy + what to do on fail</text><rect x="162" y="138" width="196" height="44" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="176" y="157" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#16202e" text-anchor="start">Validator</text><text x="176" y="172" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">pass / fail + message</text><rect x="162" y="192" width="196" height="44" rx="8" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="176" y="211" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#16202e" text-anchor="start">Validator</text><text x="176" y="226" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#586174" text-anchor="start">optional fixed value</text><rect x="416" y="118" width="80" height="60" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="456.0" y="152.5" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">LLM API</text><defs><marker id="v-gcust-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a52"></path></marker></defs><path d="M108 148 L124 148" fill="none" stroke="#0f7a52" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-gcust-m1)"></path><defs><marker id="v-gcust-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a52"></path></marker></defs><path d="M394 148 L412 148" fill="none" stroke="#0f7a52" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-gcust-m2)"></path><text x="260" y="292" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">write the check → wrap it in a guard → route calls through the server</text></svg>