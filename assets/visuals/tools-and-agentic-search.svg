<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Tool calling: the model emits a structured call, your code runs it; tools come from packages, MCP servers and hubs; agentic search" style="display: block; width: 100%; height: auto; background: #eef2ff"><rect x="24" y="30" width="124" height="60" rx="10" fill="#2f54d6" stroke="#2f54d6" stroke-width="1.2"></rect><text x="86.0" y="57.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Model</text><text x="86.0" y="73.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">never runs code</text><rect x="372" y="30" width="124" height="60" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="434.0" y="57.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Your code</text><text x="434.0" y="73.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">runs the tool</text><defs><marker id="v-tools-m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f54d6"></path></marker></defs><path d="M150 50 L368 50" fill="none" stroke="#2f54d6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#v-tools-m1)"></path><text x="260" y="42" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#2f54d6" text-anchor="middle">{ name, args }</text><text x="260" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#586174" text-anchor="middle">tool call</text><defs><marker id="v-tools-m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#586174"></path></marker></defs><path d="M370 74 L152 74" fill="none" stroke="#586174" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#v-tools-m2)"></path><text x="260" y="92" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#586174" text-anchor="middle">result goes back</text><text x="24" y="132" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#586174" text-anchor="start" letter-spacing="0.08em">READY-MADE TOOLS</text><rect x="24" y="142" width="150" height="56" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="99.0" y="167.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Integration</text><text x="99.0" y="183.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">packages</text><rect x="184" y="142" width="150" height="56" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="259.0" y="167.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">MCP</text><text x="259.0" y="183.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">servers</text><rect x="344" y="142" width="150" height="56" rx="10" fill="#ffffff" stroke="#d9dee8" stroke-width="1.2"></rect><text x="419.0" y="167.0" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="middle">Prompt hub</text><text x="419.0" y="183.0" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="middle">treat as code</text><rect x="24" y="222" width="472" height="52" rx="26" fill="#ffffff" stroke="#2f54d6" stroke-width="1.2"></rect><circle cx="52" cy="248" r="8" fill="#ffffff" stroke="#2f54d6" stroke-width="2"></circle><path d="M58 254 L64 260" stroke="#2f54d6" stroke-width="2.2" stroke-linecap="round"></path><text x="78" y="245" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16202e" text-anchor="start">Agentic search</text><text x="78" y="262" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#586174" text-anchor="start">returns clean data, not pages of links</text><rect x="380" y="236" width="104" height="22" rx="11.0" fill="#eef2ff"></rect><text x="432.0" y="250.96" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2f54d6" text-anchor="middle">best first tool</text></svg>